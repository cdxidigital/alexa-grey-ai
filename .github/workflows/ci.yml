name: Alexa Grey AI checks

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and Eve build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      BETTER_AUTH_SECRET: "ci-only-unused-development-secret-32-characters"
      VERCEL_APP_CLIENT_ID: "ci-placeholder"
      VERCEL_APP_CLIENT_SECRET: "ci-placeholder"
      ALEXA_STUDIO_ALLOWED_EMAILS: "ci@example.invalid"
      STUDIO_SIGNING_SECRET: "ci-only-unused-signing-secret-32-characters"
      # No FAL_KEY: CI must never submit a paid media request.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Build Eve agent
        run: pnpm build:eve
